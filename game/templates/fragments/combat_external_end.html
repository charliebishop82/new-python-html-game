<div class="fragment" data-hp="{{ player.current_hp }}" data-max-hp="{{ player.max_hp }}"
     data-ap="{{ player.current_ap }}" data-max-ap="{{ player.max_ap }}"
     data-credits="{{ player.credits }}">
  <div class="term-line term-good combat-boundary">════════════════ SHARED COMBAT ENDED ════════════════</div>
  <div class="term-line term-white">{{ message }}</div>
  <div class="combat-return-actions"><a class="auth-btn" href="{{ url_for('world_boss.index') }}">View Results</a></div>
</div>
