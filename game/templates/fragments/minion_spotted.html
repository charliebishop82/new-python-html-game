<!-- ============================================================ -->
<div class="fragment">
    <div class="term-line term-amber">
        ★ MINION SPOTTED — {{ minion.name }}
    </div>
    <div class="term-line term-grey">
        {{ minion.flavor_text }}
    </div>
    {% if minion.description %}<div class="term-line term-white" style="font-size:11px;">Appearance: {{ minion.description }}</div>{% endif %}
    <div class="term-line term-system">
        {{ per_result.detail }}
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
        <form class="terminal-action"
              action="{{ url_for('actions.action_boss_confirm') }}" method="POST">
            <input type="hidden" name="opponent_id"    value="{{ minion.id }}">
            <input type="hidden" name="encounter_type" value="MINION">
            <input type="hidden" name="action"         value="fight">
            <button type="submit" class="action-btn" style="width:auto;padding:6px 16px;">
                Engage
            </button>
        </form>
        <form class="terminal-action"
              action="{{ url_for('actions.action_boss_confirm') }}" method="POST">
            <input type="hidden" name="opponent_id"    value="{{ minion.id }}">
            <input type="hidden" name="encounter_type" value="MINION">
            <input type="hidden" name="action"         value="avoid">
            <button type="submit" class="action-btn" style="width:auto;padding:6px 16px;">
                Avoid (No AP cost)
            </button>
        </form>
    </div>
</div>


<!-- ============================================================ -->
